[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "NEXUS — Voice-first, cross-device personal AI agent for accessibility"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "NEXUS Team" }]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",

    # Configuration
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",

    # LLM Providers
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "ollama>=0.3.0",

    # CLI
    "rich>=13.8.0",
    "prompt-toolkit>=3.0.0",

    # Utilities
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
laptop = [
    "pywinauto>=0.6.8",
    "pynput>=1.7.0",
    "pyautogui>=0.9.54",
    "mss>=9.0.0",
    "Pillow>=10.4.0",
    "playwright>=1.47.0",
]
voice = [
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "silero-vad>=5.1",
    "pyttsx3>=2.90",
    "edge-tts>=6.1.0",
    "SpeechRecognition>=3.10.0",
    "vosk>=0.3.45",
]
android = [
    "pure-python-adb>=0.3.0",
    "grpcio>=1.66.0",
    "grpcio-tools>=1.66.0",
    "protobuf>=5.28.0",
]
memory = [
    "chromadb>=0.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-psutil>=6.0.0",
]

[project.scripts]
nexus = "nexus.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
